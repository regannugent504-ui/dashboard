<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">


</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <header>
        <h1>My Dashboard</h1>
        <button type="button" id="theme-toggle">Toggle dark mode</button>
    </header>
    <main id="main">
        <div class="dashboard">
            <section class="widget">
                <h2>Sample Weather</h2>
                <div id="weather-display">Loading weather…</div>
            </section>
            <section class="widget">
                <h2>Quote</h2>
                <div id="quotes-display">Loading quotes…</div>
                <button type="button" id="new-quote-btn" class="btn-primary" disabled>New quote</button>
            </section>
            <section class="widget">
                <h2>Tasks</h2>
                <div id="task-stats" aria-live="polite"></div>
                <form id="task-form">
                    <label for="task-input">New task</label>
                    <input type="text" id="task-input" required>
                    <button type="submit" class="btn-primary">Add task</button>
                </form>
                <ul id="task-list"></ul>
            </section>
        </div>
    </main>
    <script src="js/apps.js"></script>
</body>
</html>
